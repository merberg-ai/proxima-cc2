name: reference

on:
  push:
  pull_request:

jobs:
  dualtrust-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reproduce frozen Neme77 Dual Trust payload
        run: python dualtrust/assemble_payload.py --self-test-only
